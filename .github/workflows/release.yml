name: Release package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version to publish, for example 2.5.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Configure pub.dev credentials
        run: dart pub token add https://pub.dev --env-var PUB_DEV_TOKEN
        env:
          PUB_DEV_TOKEN: ${{ secrets.PUB_DEV_TOKEN }}
      - name: Install pub_release
        run: dart pub global activate pub_release 11.9.0
      - name: Publish release
        run: pub_release --setVersion="${{ inputs.version }}" --autoAnswer --ignore-warnings
        env:
          GH_TOKEN: ${{ github.token }}
